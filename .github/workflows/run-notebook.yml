  - name: Set up Python
    uses: actions/setup-python@v4

      python-version: '3.9'

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install nbconvert

  - name: Generate dataset
    run: |
      python data/generate_auth_logs.py --rows 1000 --out data/auth_logs_expanded.csv

  - name: Execute notebook
    run: |
      jupyter nbconvert --to notebook --execute notebooks/analysis.ipynb --ExecutePreprocessor.timeout=600 --output notebooks/analysis_executed.ipynb

  - name: Commit demo images
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"
      git add demo || true
      git add data/auth_logs_expanded.csv || true
      git commit -m "Add generated dataset and demo images from notebook" || echo "No changes to commit"
      git push
